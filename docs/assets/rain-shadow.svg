<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-label="雨陰の断面図。海で水分を拾った湿った風が山の風上斜面で上昇して雨を落とし、山を越えた風下側では乾いた風が降りて乾燥する。">
  <style>
    .sea    { stroke: #5a9bd4; stroke-width: 2; fill: #5a9bd433; }
    .earth  { stroke: #888; stroke-width: 2; fill: #88888833; }
    .wind   { stroke: #5a9bd4; stroke-width: 2.5; fill: none; }
    .vapor  { stroke: #5a9bd4; stroke-width: 1.3; fill: none; }
    .dry    { stroke: #cc9966; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .cloud  { stroke: #8b949e; stroke-width: 1.5; fill: #8b949e22; }
    .rain   { stroke: #5a9bd4; stroke-width: 1.5; }
    .label  { fill: #8b949e; font-family: sans-serif; font-size: 15px; }
    .blue   { fill: #5a9bd4; font-family: sans-serif; font-size: 14px; }
    .warm   { fill: #cc9966; font-family: sans-serif; font-size: 14px; }
  </style>
  <defs>
    <marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5a9bd4"/>
    </marker>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cc9966"/>
    </marker>
  </defs>

  <!-- 海 -->
  <path class="sea" d="M20,215 L230,215 L230,258 L20,258 Z"/>
  <text x="115" y="245" text-anchor="middle" class="blue">海</text>

  <!-- 地形（風上急・風下なだらか） -->
  <path class="earth" d="M230,215 C310,200 350,140 435,98 Q455,88 472,96 C550,128 645,172 750,180 L750,258 L230,258 Z"/>

  <!-- 湿った風 -->
  <line class="wind" x1="40" y1="70" x2="165" y2="70" marker-end="url(#wa)"/>
  <text x="100" y="52" text-anchor="middle" class="blue">湿った風</text>

  <!-- 蒸発 -->
  <line class="vapor" x1="85" y1="207" x2="85" y2="180" marker-end="url(#wa)"/>
  <line class="vapor" x1="125" y1="207" x2="125" y2="180" marker-end="url(#wa)"/>
  <line class="vapor" x1="165" y1="207" x2="165" y2="180" marker-end="url(#wa)"/>
  <text x="125" y="166" text-anchor="middle" class="blue">蒸発で水分を拾う</text>

  <!-- 上昇と雨（風上） -->
  <ellipse class="cloud" cx="315" cy="130" rx="40" ry="17"/>
  <ellipse class="cloud" cx="355" cy="120" rx="30" ry="14"/>
  <line class="rain" x1="298" y1="152" x2="291" y2="182"/>
  <line class="rain" x1="318" y1="152" x2="311" y2="185"/>
  <line class="rain" x1="338" y1="150" x2="331" y2="180"/>
  <text x="300" y="92" text-anchor="middle" class="blue">上昇 → 雨</text>

  <!-- 乾いた風（風下） -->
  <line class="dry" x1="490" y1="100" x2="605" y2="142" marker-end="url(#da)"/>
  <text x="565" y="105" text-anchor="middle" class="warm">乾いた風</text>
  <text x="660" y="148" text-anchor="middle" class="warm">雨陰（乾燥）</text>

  <!-- 下部ラベル -->
  <text x="330" y="248" text-anchor="middle" class="label">風上</text>
  <text x="620" y="248" text-anchor="middle" class="label">風下</text>
</svg>
