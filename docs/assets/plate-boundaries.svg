<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-label="プレート境界の断面図。左：収束境界ではプレートどうしがぶつかり境界に山脈が隆起する。右：発散境界ではプレートが離れ境界に地溝が沈降する。">
  <style>
    .earth  { stroke: #5a9bd4; stroke-width: 2; fill: #5a9bd433; }
    .bound  { stroke: #888; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .motion { stroke: #cc6666; stroke-width: 2.5; }
    .label  { fill: #8b949e; font-family: sans-serif; font-size: 15px; }
    .title  { fill: #8b949e; font-family: sans-serif; font-size: 16px; font-weight: bold; }
    .accent { fill: #cc6666; font-family: sans-serif; font-size: 14px; }
  </style>
  <defs>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cc6666"/>
    </marker>
  </defs>

  <!-- 左：収束境界 -->
  <text x="195" y="30" text-anchor="middle" class="title">収束境界（ぶつかる）</text>
  <text x="195" y="70" text-anchor="middle" class="accent">隆起 → 山脈</text>
  <path class="earth" d="M30,185 L110,180 C150,175 160,115 195,88 C230,115 240,175 280,180 L360,185 L360,245 L30,245 Z"/>
  <line class="bound" x1="195" y1="100" x2="195" y2="245"/>
  <line class="motion" x1="48" y1="150" x2="122" y2="150" marker-end="url(#mv)"/>
  <line class="motion" x1="342" y1="150" x2="268" y2="150" marker-end="url(#mv)"/>
  <text x="82" y="134" text-anchor="middle" class="label">プレート A</text>
  <text x="308" y="134" text-anchor="middle" class="label">プレート B</text>

  <!-- 右：発散境界 -->
  <text x="585" y="30" text-anchor="middle" class="title">発散境界（離れる）</text>
  <text x="585" y="70" text-anchor="middle" class="accent">沈降 → 地溝</text>
  <path class="earth" d="M420,165 L495,170 C530,173 545,208 585,212 C625,208 640,173 675,170 L750,165 L750,245 L420,245 Z"/>
  <line class="bound" x1="585" y1="120" x2="585" y2="245"/>
  <line class="motion" x1="552" y1="135" x2="478" y2="135" marker-end="url(#mv)"/>
  <line class="motion" x1="618" y1="135" x2="692" y2="135" marker-end="url(#mv)"/>
  <text x="512" y="119" text-anchor="middle" class="label">プレート A</text>
  <text x="658" y="119" text-anchor="middle" class="label">プレート B</text>
</svg>
